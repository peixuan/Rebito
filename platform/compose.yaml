name: rebito

services:
  app:
    build: .
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Run npm run configure first}
      AUTH_SECRET: ${AUTH_SECRET:?Run npm run configure first}
      DATABASE_URL: postgresql://retro:${DATABASE_PASSWORD:?Run npm run configure first}@database:5432/retro
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      MAX_LIBRARY_BYTES: ${MAX_LIBRARY_BYTES:-10737418240}
      MAX_PROFILES_PER_USER: ${MAX_PROFILES_PER_USER:-100}
      MAX_REVISIONS_PER_USER: ${MAX_REVISIONS_PER_USER:-2000}
      MAX_TOTAL_REVISIONS: ${MAX_TOTAL_REVISIONS:-10000}
      MAX_TOTAL_SAVE_BYTES: ${MAX_TOTAL_SAVE_BYTES:-10737418240}
      MAX_SAVE_BYTES_PER_USER: ${MAX_SAVE_BYTES_PER_USER:-2147483648}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-1073741824}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - saves:/data
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  database:
    image: public.ecr.aws/docker/library/postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run configure first}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:?Run npm run configure first}
    volumes:
      - database:/var/lib/postgresql
      - ./database/init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retro"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  saves:
  database:
