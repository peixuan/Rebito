name: rebito-tests
services:
  database:
    image: public.ecr.aws/docker/library/postgres:18-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_USER: retro_test
      POSTGRES_PASSWORD: integration-test-only
      POSTGRES_DB: retro_test
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro_test -d retro_test"]
      interval: 2s
      timeout: 3s
      retries: 20
