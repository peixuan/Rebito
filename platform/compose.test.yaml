name: rebito-tests
services:
  database:
    image: public.ecr.aws/docker/library/postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_USER: retro_test
      POSTGRES_PASSWORD: integration-test-only
      POSTGRES_DB: retro_test
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro_test -d retro_test"]
      interval: 2s
      timeout: 3s
      retries: 20
