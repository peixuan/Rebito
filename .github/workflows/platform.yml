name: platform

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install verified Gitleaks CLI
        run: |
          mkdir "$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Check exception scope and reachable history
        run: |
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks/gitleaks" node scripts/check-secret-scan.mjs
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact=100 --no-banner

  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test repository policy
        run: node --test scripts/*.test.mjs
      - name: Test deployment admission
        run: python3 -B -m unittest discover -s platform/deploy -p '*_test.py'
      - name: Review locked dependency licenses
        run: node scripts/dependency-policy.mjs
      - name: Check the complete source history
        run: node scripts/commit-policy.mjs --history

  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
        env:
          POSTGRES_USER: retro_test
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: retro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retro_test -d retro_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PG_TEST_URL: postgresql://retro_test:integration-test-only@127.0.0.1:5432/retro_test
    strategy:
      matrix:
        node: ['24', '26']
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - if: matrix.node == '24'
        # Ubuntu's AppArmor profile permits Chrome's sandbox at its system path.
        run: npx playwright install --with-deps chrome
      - if: matrix.node == '24'
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/configure.mjs
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose exec -T app node --input-type=module < scripts/check-runtime-image.mjs
      - run: docker compose exec -T app node --input-type=module < scripts/seed-container-game.mjs
      - name: Provision and verify a disposable account
        run: |
          node --input-type=module -e 'import {randomBytes} from "node:crypto"; console.log(JSON.stringify({email:"smoke@example.test",name:"Smoke",password:randomBytes(24).toString("hex")}))' > "$RUNNER_TEMP/retro-account.json"
          docker compose run --rm -T app node dist/server/create-account.js < "$RUNNER_TEMP/retro-account.json"
          node scripts/container-smoke.mjs < "$RUNNER_TEMP/retro-account.json"
          docker compose restart
          docker compose up -d --wait --wait-timeout 60
          node scripts/container-smoke.mjs < "$RUNNER_TEMP/retro-account.json"
      - name: Exercise deployment rollback with isolated volumes
        run: |
          sudo python3 -B deploy/restore_drill.py --platform "$PWD" \
            --image "$(docker compose images --quiet app)"
      - if: always()
        run: docker compose down
